# On-demand image builds for personal testing against my own infrastructure.
# Fork-local only — this branch (tools/image-build) is never opened as a PR
# against upstream and never merged into main/develop, so it never syncs
# with linagora/openrag (see .claude/rules/fork-context.md).
#
# Manually dispatched: checks out whatever `ref` you point it at (any
# branch/tag/SHA in this fork) and pushes api/ray/admin-ui images to Docker
# Hub under thibautchoppy/openrag(-ray|-admin-ui):<tag>. This lets you build
# a test image from any branch's code without adding CI changes to that
# branch's own upstream-bound PR.
#
# Requires `DOCKERHUB_USERNAME` (repo variable) and `DOCKERHUB_TOKEN` (repo
# secret) configured on this fork, e.g.:
#   gh variable set DOCKERHUB_USERNAME --repo ThibautChoppy/openrag --body <username>
#   gh secret set DOCKERHUB_TOKEN --repo ThibautChoppy/openrag
#
# Usage:
#   gh workflow run build_on_demand.yml --repo ThibautChoppy/openrag \
#     --ref tools/image-build -f ref=<branch-or-tag-or-sha> -f tag=v2.0.1
name: Build On-Demand Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (any branch in this fork)"
        required: true
      tag:
        description: "Image tag to publish, e.g. v2.0.1 or v2.0.1-rc.1"
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::tag must look like v2.0.1 or v2.0.1-rc.1 (got '$TAG')."
            exit 1
          fi

  build-and-push-api:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: thibautchoppy/openrag:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-ray:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ray image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/ray.Dockerfile
          platforms: linux/amd64
          push: true
          tags: thibautchoppy/openrag-ray:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-admin-ui:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push admin-ui image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/ui.Dockerfile
          platforms: linux/amd64
          push: true
          tags: thibautchoppy/openrag-admin-ui:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
