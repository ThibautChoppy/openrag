# On-demand image builds for personal testing against my own infrastructure.
# Fork-local only — this branch (tools/image-build) is never opened as a PR
# against upstream and never merged into main/develop, so it never syncs
# with linagora/openrag (see .claude/rules/fork-context.md).
#
# Manually dispatched: checks out whatever `ref` you point it at (any
# branch/tag/SHA in this fork) and pushes api/ray/admin-ui images to ghcr
# under ghcr.io/thibautchoppy/openrag(-ray|-admin-ui):<tag>. This lets you
# build a test image from any branch's code without adding CI changes to
# that branch's own upstream-bound PR.
#
# Pushes with the built-in GITHUB_TOKEN — no repo secrets to configure.
# `github.repository` preserves owner/repo casing verbatim (e.g. this fork's
# mixed-case "ThibautChoppy/openrag"), but ghcr (like any OCI registry)
# requires a lowercase repository path, so `vars` lowercases it once for the
# other jobs to reuse.
#
# Usage:
#   gh workflow run build_on_demand.yml --repo ThibautChoppy/openrag \
#     --ref tools/image-build -f ref=<branch-or-tag-or-sha> -f tag=v2.0.1
name: Build On-Demand Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build (any branch in this fork)"
        required: true
      tag:
        description: "Image tag to publish, e.g. v2.0.1 or v2.0.1-rc.1"
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::tag must look like v2.0.1 or v2.0.1-rc.1 (got '$TAG')."
            exit 1
          fi

      - name: Compute lowercase image name
        id: vars
        run: echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build-and-push-api:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.validate.outputs.image_name }}:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-ray:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ray image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/ray.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.validate.outputs.image_name }}-ray:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-admin-ui:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push admin-ui image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/ui.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.validate.outputs.image_name }}-admin-ui:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
