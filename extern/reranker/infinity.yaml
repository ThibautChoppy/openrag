x-reranker: &reranker_template
  networks:
    default:
      aliases:
        - reranker
  volumes:
    - ${VLLM_CACHE:-/root/.cache/huggingface}:/app/.cache/huggingface # Model weights for RAG
  # ports:
  #   - ${RERANKER_PORT:-7997}:7997

services:
  reranker:
    <<: *reranker_template
    image: michaelf34/infinity
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all 
              capabilities: [gpu]
    command: >
      v2
      --model-id ${RERANKER_MODEL:-Alibaba-NLP/gte-multilingual-reranker-base}
      --api-key ${RERANKER_API_KEY:-"EMPTY"}
      --port 7997
    profiles:
      - ''

  reranker-cpu:
    <<: *reranker_template
    image: michaelf34/infinity:latest-cpu
    deploy: {}
    command: >
      v2
      --engine torch
      --model-id ${RERANKER_MODEL:-Alibaba-NLP/gte-multilingual-reranker-base}
      --api-key ${RERANKER_API_KEY:-"EMPTY"}
      --port 7997
    profiles:
      - 'cpu'

  reranker-rocm:
    <<: *reranker_template
    image: michaelf34/infinity:latest-rocm
    environment:
      # See the same note on vllm-rocm in docker-compose.yaml: RX 7800 XT
      # (gfx1101) reporting as gfx1100 (RDNA3, officially validated) is the
      # standard workaround for this generation of consumer cards.
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    security_opt:
      - seccomp=unconfined
    command: >
      v2
      --model-id ${RERANKER_MODEL:-Alibaba-NLP/gte-multilingual-reranker-base}
      --api-key ${RERANKER_API_KEY:-"EMPTY"}
      --port 7997
    profiles:
      - 'rocm'
